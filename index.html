<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M.J. Gross Inc. | Secure Inventory Portal</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22000%22/><text x=%2250%25%22 y=%2256%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-family=%22serif%22 font-weight=%22bold%22 font-size=%2246%22 fill=%22white%22>MJG</text></svg>">

  <style>
    :root {
      --black: #050505;
      --gold: #C5A059;
      --soft-gold: #eadbb8;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --bg: #f6f7f9;
      --white: #ffffff;
      --danger: #b91c1c;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(197,160,89,0.18), transparent 34%),
        linear-gradient(135deg, #f7f7f8 0%, #ffffff 45%, #f2f3f5 100%);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-shell {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(229,231,235,0.95);
      border-radius: 28px;
      box-shadow:
        0 28px 80px rgba(15,23,42,0.12),
        0 2px 8px rgba(15,23,42,0.04);
      overflow: hidden;
      backdrop-filter: blur(14px);
    }

    .brand-panel {
      background:
        linear-gradient(145deg, #050505 0%, #151515 58%, #2a2418 100%);
      padding: 34px 28px 30px;
      text-align: center;
      border-bottom: 3px solid var(--gold);
    }

    .logo-wrap {
      width: 148px;
      height: 68px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      filter: brightness(1.05);
    }

    .fallback-logo {
      display: none;
      width: 116px;
      height: 58px;
      border: 1px solid rgba(197,160,89,0.55);
      border-radius: 16px;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: Georgia, serif;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 1px;
    }

    .brand-title {
      margin: 0;
      color: #ffffff;
      font-size: 1.42rem;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .brand-subtitle {
      margin: 8px 0 0;
      color: rgba(255,255,255,0.68);
      font-size: 0.93rem;
      font-weight: 500;
    }

    .form-panel {
      padding: 30px 28px 28px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #374151;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .field input {
      width: 100%;
      height: 50px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #ffffff;
      padding: 0 15px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .field input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(197,160,89,0.16);
      background: #fffdf8;
    }

    .login-btn {
      width: 100%;
      height: 52px;
      margin-top: 8px;
      border: none;
      border-radius: 17px;
      background: var(--black);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.2px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      box-shadow: 0 10px 22px rgba(0,0,0,0.14);
    }

    .login-btn:hover {
      background: #151515;
      transform: translateY(-1px);
      box-shadow: 0 13px 28px rgba(0,0,0,0.18);
    }

    .login-btn:active {
      transform: translateY(0);
      box-shadow: 0 8px 18px rgba(0,0,0,0.14);
    }

    .error {
      display: none;
      margin: 12px 0 0;
      color: var(--danger);
      font-size: 0.88rem;
      font-weight: 600;
      text-align: center;
    }

    .secure-note {
      margin: 20px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.4;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .login-shell {
        border-radius: 24px;
      }

      .brand-panel {
        padding: 30px 22px 26px;
      }

      .form-panel {
        padding: 26px 22px 24px;
      }

      .logo-wrap {
        width: 138px;
        height: 64px;
      }

      .brand-title {
        font-size: 1.28rem;
      }
    }
  </style>
</head>

<body>
  <main class="login-shell">
    <section class="brand-panel">
      <div class="logo-wrap">
        <img src="images/logo.jpg" alt="M.J. Gross Inc." onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='flex';">
        <div class="fallback-logo" id="fallback-logo">MJG</div>
      </div>

      <h1 class="brand-title">Secure Inventory Portal</h1>
      <p class="brand-subtitle">M.J. Gross Inc.</p>
    </section>

    <section class="form-panel">
      <form id="login-form">
        <div class="field">
          <label for="email">Email Address</label>
          <input id="email" type="email" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required />
        </div>

        <button class="login-btn" type="submit">Log In</button>

        <div class="error" id="login-error">
          Please enter an email address and password.
        </div>

        <p class="secure-note">
          Authorized access only.
        </p>
      </form>
    </section>
  </main>

  <script>
    document.getElementById('login-form').addEventListener('submit', function(event) {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const error = document.getElementById('login-error');

      if (!email || !password) {
        error.style.display = 'block';
        return;
      }

      error.style.display = 'none';

      localStorage.setItem('mjg_inventory_logged_in', 'true');
      localStorage.setItem('mjg_inventory_login_email', email);

      window.location.href = 'inventory.html';
    });
  </script>
</body>
</html>
